<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slameh - بوابتك لخدمات ومعلومات المدينة</title>
    <style>
        body {
            font-family: 'Tajawal', 'Amiri', serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            font-size: 3rem;
            margin: 0;
            color: #FFD700;
        }
        p {
            font-size: 1.2rem;
            margin: 1rem 0;
        }
        .loading {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #FFD700;
            animation: spin 1s ease-in-out infinite;
            margin: 1rem 0;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Slameh</h1>
        <p>بوابتك لخدمات ومعلومات المدينة</p>
        <div class="loading"></div>
        <p>جاري التحميل...</p>
    </div>
    <script>
        // Redirect to the Next.js app
        window.location.href = '/';
    </script>
</body>
</html>
